<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ECM Marketplace</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0;
        }
        nav {
            background-color: #34495e;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            margin-right: 10px;
            background-color: #3498db;
            border-radius: 3px;
            display: inline-block;
        }
        nav a:hover {
            background-color: #2980b9;
        }
        .content {
            background-color: white;
            padding: 30px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 3px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        #msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 3px;
            display: none;
        }
        #msg.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        #msg.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #3498db;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .hint {
            margin-top: 20px;
            padding: 10px;
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 3px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Login - ECM Marketplace</h1>
    </header>
    
    <nav>
        <a href="index.html" id="nav-home">Home</a>
        <a href="login.html" id="nav-login">Login</a>
        <a href="products.html" id="nav-products">Products</a>
        <a href="checkout.html" id="nav-checkout">Checkout</a>
    </nav>
    
    <div class="content">
        <h2>Login</h2>
        <form onsubmit="event.preventDefault(); doLogin();">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" id="btnLogin">Login</button>
        </form>
        
        <div id="msg" role="alert"></div>
        
        <div class="hint">
            <strong>Test Credentials:</strong><br>
            Username: valid_user<br>
            Password: secret123
        </div>
    </div>

    <script>
        function doLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const msgDiv = document.getElementById('msg');
            const btnLogin = document.getElementById('btnLogin');
            
            // Disable button during processing
            btnLogin.disabled = true;
            msgDiv.style.display = 'none';
            msgDiv.className = '';
            
            // Simulate network delay (600ms)
            setTimeout(() => {
                if (username === 'valid_user' && password === 'secret123') {
                    // Success
                    localStorage.setItem('auth', 'true');
                    msgDiv.textContent = 'Login successful';
                    msgDiv.className = 'success';
                    
                    // Redirect to products page after 1 second
                    setTimeout(() => {
                        window.location.href = 'products.html';
                    }, 1000);
                } else {
                    // Failure
                    msgDiv.textContent = 'Invalid credentials';
                    msgDiv.className = 'error';
                    btnLogin.disabled = false;
                }
            }, 600);
        }
    </script>
</body>
</html>
